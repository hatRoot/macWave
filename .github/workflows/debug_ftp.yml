name: Debug FTP Structure

on:
  push:
    branches:
      - main

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Run FTP Debug Script
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import ftplib
          import sys
          import os

          password = os.getenv('FTP_PASS')
          if not password:
              print('FTP_PASSWORD secret is empty!')
              sys.exit(1)

          try:
              ftp = ftplib.FTP('69.6.201.199')
              ftp.login('leoncito@macwave.com.mx', password)
              print('=== Logged in successfully ===')
              print('Current FTP directory (pwd):', ftp.pwd())
              print('--- Directory contents ---')
              ftp.dir()
              
              # Try to list some common subdirectories if they exist
              for folder in ['public_html', 'repositories', 'site']:
                  try:
                      print(f'\n--- Checking folder: {folder} ---')
                      ftp.cwd('/')
                      ftp.cwd(folder)
                      print(f'Entered {folder} successfully. Pwd: {ftp.pwd()}')
                      ftp.dir()
                  except Exception as e:
                      print(f'Could not enter {folder}: {e}')
                      
              ftp.quit()
          except Exception as e:
              print('FTP Error:', e)
              sys.exit(1)
          "
