name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: macwave.com.mx
        username: leoncito@macwave.com.mx
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /home1/joeldura/public_html/
