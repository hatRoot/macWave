name: Deploy to HostGator via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 69.6.201.199
          username: leoncito@macwave.com.mx
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          protocol: ftp
          port: 21
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/scratch/**
            **/.DS_Store
            **/legacy/**
            **/DURAN/**
            **/*.bak
            **/*.py
            **/package.json
            **/package-lock.json
